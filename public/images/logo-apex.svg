<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0038a8"/>
      <stop offset="50%" stop-color="#004ecb"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a00008"/>
      <stop offset="100%" stop-color="#ff2b36"/>
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Inner Glow/Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  
  <!-- Sport Car Silhouette -->
  <g transform="translate(106, 120)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body Profile -->
    <path d="M 30 180 L 70 90 Q 110 30 180 30 L 220 30 Q 260 90 280 180 Z" fill="rgba(255,255,255,0.1)"/>
    <path d="M 10 200 L 40 200 Q 50 150 90 150 Q 130 150 140 200 L 210 200 Q 220 150 260 150 Q 300 150 310 200 L 330 200 Q 340 180 330 140 L 290 80 Q 260 20 190 20 L 120 20 Q 70 20 40 80 L 10 140 Z"/>
    <!-- Headlights & Grid lines -->
    <circle cx="70" cy="180" r="18" fill="#ffffff"/>
    <circle cx="230" cy="180" r="18" fill="#ffffff"/>
    <line x1="110" y1="180" x2="190" y2="180" stroke="#ffffff" stroke-width="16"/>
  </g>
  
  <!-- Accent Dot (Red Racing Badge) -->
  <circle cx="410" cy="410" r="32" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="8"/>
</svg>
